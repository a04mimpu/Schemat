<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Månatligt Kontorsschema</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans",
                "Droid Sans", "Helvetica Neue", sans-serif;
        }

        .week-separator {
            border-left: 3px solid #4f46e5;
        }
    </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const { useState, useEffect } = React;


/* =========================================================
   ICONS
   ========================================================= */

const LockIcon = ({ className }) => (
    <svg
        className={className}
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
    >
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
);


const UnlockIcon = ({ className }) => (
    <svg
        className={className}
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
    >
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
    </svg>
);


const CalendarIcon = ({ className }) => (
    <svg
        className={className}
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
    >
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
    </svg>
);


const RotateIcon = ({ className }) => (
    <svg
        className={className}
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
    >
        <polyline points="1 4 1 10 7 10"></polyline>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
    </svg>
);


const DownloadIcon = ({ className }) => (
    <svg
        className={className}
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
    >
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
    </svg>
);



/* =========================================================
   MAIN APPLICATION
   ========================================================= */

const MonthlyScheduler = () => {

    const people = [
        "Gunilla",
        "Minetthe",
        "Lennart",
        "Carl"
    ];

    const weekdays = [
        "Måndag",
        "Tisdag",
        "Onsdag",
        "Torsdag",
        "Fredag"
    ];


    /* =====================================================
       STATE

       IMPORTANT:
       There is NO separate statistics state.

       schedule is the single source of truth.
       ===================================================== */

    const [schedule, setSchedule] = useState({});
    const [locked, setLocked] = useState({});
    const [startDate, setStartDate] = useState("");
    const [monthDates, setMonthDates] = useState([]);



    /* =====================================================
       DATES
       ===================================================== */

    useEffect(() => {

        if (startDate) {
            calculateMonthDates(startDate);
        }

    }, [startDate]);


    const calculateMonthDates = (dateString) => {

        const start = new Date(dateString);

        const dates = [];

        let currentDate = new Date(start);


        for (let i = 0; i < 20; i++) {

            while (
                currentDate.getDay() === 0 ||
                currentDate.getDay() === 6
            ) {

                currentDate.setDate(
                    currentDate.getDate() + 1
                );
            }


            dates.push(
                new Date(currentDate)
            );


            currentDate.setDate(
                currentDate.getDate() + 1
            );
        }


        setMonthDates(dates);
    };


    const formatDate = (date) => {

        const day = String(
            date.getDate()
        ).padStart(2, "0");


        const month = String(
            date.getMonth() + 1
        ).padStart(2, "0");


        return `${day}/${month}`;
    };


    const getWeekNumber = (index) => {
        return Math.floor(index / 5) + 1;
    };


    const getDayName = (index) => {
        return weekdays[index % 5];
    };


    const isFriday = (index) => {
        return index % 5 === 4;
    };



    /* =====================================================
       LIVE STATISTICS

       This function reads DIRECTLY from schedule.

       Example:
       Gunilla F -> H

       schedule changes
       React renders again
       countLocation runs again
       F decreases
       H increases
       ===================================================== */

    const countLocation = (person, location) => {

        let count = 0;


        for (let dayIndex = 0; dayIndex < 20; dayIndex++) {

            const currentLocation =
                schedule[dayIndex]?.[person];


            if (currentLocation === location) {
                count++;
            }
        }


        return count;
    };


    const getOfficeTotal = (person) => {

        return (
            countLocation(person, "H") +
            countLocation(person, "F")
        );
    };



    /* =====================================================
       GENERATE SCHEDULE
       ===================================================== */

    const generateSchedule = () => {

        const newSchedule = {};


        /*
         * Temporary counters used ONLY while generating
         * the new schedule.
         *
         * These are NOT the statistics displayed on screen.
         */

        const workingStats = {};


        people.forEach(person => {

            workingStats[person] = {
                H: 0,
                F: 0,
                HOME: 0
            };

        });



        for (
            let dayIndex = 0;
            dayIndex < 20;
            dayIndex++
        ) {

            const dailyAssignments = {};

            const friday = isFriday(dayIndex);


            /*
             * People marked AWAY are unavailable.
             */

            const availablePeople =
                people.filter(person => {

                    const key =
                        `${person}-${dayIndex}`;

                    return locked[key] !== "AWAY";

                });



            /* ---------------------------------------------
               PRESERVE LOCKED POSITIONS
               --------------------------------------------- */

            people.forEach(person => {

                const key =
                    `${person}-${dayIndex}`;

                const lockedLocation =
                    locked[key];


                if (
                    lockedLocation &&
                    lockedLocation !== "AWAY"
                ) {

                    dailyAssignments[person] =
                        lockedLocation;


                    if (
                        lockedLocation === "H" ||
                        lockedLocation === "F" ||
                        lockedLocation === "HOME"
                    ) {

                        workingStats[person][lockedLocation]++;
                    }


                    const index =
                        availablePeople.indexOf(person);


                    if (index > -1) {

                        availablePeople.splice(
                            index,
                            1
                        );
                    }
                }

            });



            /* ---------------------------------------------
               COUNT ALREADY LOCKED ASSIGNMENTS
               --------------------------------------------- */

            const assigned =
                Object.values(
                    dailyAssignments
                );


            const hCount =
                assigned.filter(
                    location =>
                        location === "H"
                ).length;


            const fCount =
                assigned.filter(
                    location =>
                        location === "F"
                ).length;


            const homeCount =
                assigned.filter(
                    location =>
                        location === "HOME"
                ).length;



            /* ---------------------------------------------
               DETERMINE DAILY NEED
               --------------------------------------------- */

            let needH = 0;
            let needF = 0;
            let needHome = 0;


            if (friday) {

                /*
                 * Friday
                 *
                 * 0 Hisingen
                 * 2 Frölunda
                 * 2 Home
                 */

                needH = 0;

                needF =
                    Math.max(
                        0,
                        2 - fCount
                    );


                needHome =
                    Math.max(
                        0,
                        2 - homeCount
                    );

            } else {

                /*
                 * Monday - Thursday
                 *
                 * 1 Hisingen
                 * 2 Frölunda
                 * 1 Home
                 */

                needH =
                    Math.max(
                        0,
                        1 - hCount
                    );


                needF =
                    Math.max(
                        0,
                        2 - fCount
                    );


                needHome =
                    Math.max(
                        0,
                        1 - homeCount
                    );
            }



            /* ---------------------------------------------
               CHOOSE PERSON

               Choose among people with the lowest number
               of assignments for that location.

               If several people have the same number,
               choose randomly between them.
               --------------------------------------------- */

            const choosePerson = (location) => {

                if (
                    availablePeople.length === 0
                ) {
                    return null;
                }


                let lowest = Infinity;


                availablePeople.forEach(person => {

                    const amount =
                        workingStats[person][location];


                    if (amount < lowest) {
                        lowest = amount;
                    }
                });


                const candidates =
                    availablePeople.filter(person => {

                        return (
                            workingStats[person][location]
                            === lowest
                        );
                    });


                const randomIndex =
                    Math.floor(
                        Math.random() *
                        candidates.length
                    );


                return candidates[randomIndex];
            };



            /* ---------------------------------------------
               ASSIGN LOCATION
               --------------------------------------------- */

            const assignLocation =
                (location, amount) => {


                    for (
                        let i = 0;
                        i < amount;
                        i++
                    ) {

                        const person =
                            choosePerson(location);


                        if (!person) {
                            break;
                        }


                        dailyAssignments[person] =
                            location;


                        workingStats[person][location]++;


                        const index =
                            availablePeople.indexOf(
                                person
                            );


                        if (index > -1) {

                            availablePeople.splice(
                                index,
                                1
                            );
                        }
                    }
                };



            /* ---------------------------------------------
               ASSIGN DAILY LOCATIONS
               --------------------------------------------- */

            if (!friday) {

                assignLocation(
                    "H",
                    needH
                );
            }


            assignLocation(
                "F",
                needF
            );


            assignLocation(
                "HOME",
                needHome
            );


            newSchedule[dayIndex] =
                dailyAssignments;
        }


        /*
         * ONE state update.
         */

        setSchedule(newSchedule);
    };



    /* =====================================================
       MANUAL CHANGE

       This is the important fix.
       ===================================================== */

    const changeLocation =
        (person, dayIndex, newLocation) => {


            setSchedule(previousSchedule => {


                /*
                 * Make a new copy of schedule.
                 */

                const newSchedule = {
                    ...previousSchedule
                };


                /*
                 * IMPORTANT:
                 * Also make a NEW copy of the selected day.
                 *
                 * This guarantees React sees that the
                 * nested object has changed.
                 */

                const newDay = {
                    ...(previousSchedule[dayIndex] || {})
                };


                if (newLocation === "") {

                    delete newDay[person];

                } else {

                    newDay[person] =
                        newLocation;
                }


                newSchedule[dayIndex] =
                    newDay;


                return newSchedule;
            });
        };



    /* =====================================================
       AWAY / LEDIG
       ===================================================== */

    const setAway =
        (person, dayIndex) => {


            const key =
                `${person}-${dayIndex}`;


            /*
             * Mark as away.
             */

            setLocked(previous => ({

                ...previous,

                [key]: "AWAY"

            }));


            /*
             * Remove existing location from schedule.
             */

            changeLocation(
                person,
                dayIndex,
                ""
            );
        };



    const removeAway =
        (person, dayIndex) => {


            const key =
                `${person}-${dayIndex}`;


            setLocked(previous => {

                const next = {
                    ...previous
                };


                delete next[key];


                return next;
            });
        };



    /* =====================================================
       LOCK / UNLOCK
       ===================================================== */

    const toggleLock =
        (person, dayIndex) => {


            const key =
                `${person}-${dayIndex}`;


            setLocked(previous => {


                const next = {
                    ...previous
                };


                /*
                 * AWAY is handled separately.
                 */

                if (next[key] === "AWAY") {

                    return next;
                }


                if (next[key]) {

                    /*
                     * Unlock
                     */

                    delete next[key];

                } else {

                    /*
                     * Lock current location
                     */

                    const currentLocation =
                        schedule[dayIndex]?.[person];


                    if (currentLocation) {

                        next[key] =
                            currentLocation;
                    }
                }


                return next;
            });
        };



    /* =====================================================
       RESET
       ===================================================== */

    const resetSchedule = () => {

        setSchedule({});
        setLocked({});

    };



    /* =====================================================
       COLORS
       ===================================================== */

    const getLocationColor = (location) => {

        switch (location) {

            case "H":

                return (
                    "bg-pink-100 text-pink-800"
                );


            case "F":

                return (
                    "bg-green-100 text-green-800"
                );


            case "HOME":

                return (
                    "bg-blue-100 text-blue-800"
                );


            default:

                return "bg-white";
        }
    };



    /* =====================================================
       EXPORT CSV
       ===================================================== */

    const exportToExcel = () => {

        let csv =
            "Månatligt Schema\n";


        csv +=
            "Startdatum:," +
            (startDate || "Ej angivet") +
            "\n\n";


        csv += "Person,";



        for (
            let i = 0;
            i < 20;
            i++
        ) {

            const dayName =
                getDayName(i);


            const date =
                monthDates[i]
                    ? formatDate(
                        monthDates[i]
                    )
                    : "";


            csv +=
                `${dayName} ${date},`;
        }


        csv += "\n";



        people.forEach(person => {


            const row = [person];


            for (
                let dayIndex = 0;
                dayIndex < 20;
                dayIndex++
            ) {


                const key =
                    `${person}-${dayIndex}`;


                if (
                    locked[key] === "AWAY"
                ) {

                    row.push("Ledig");

                } else {

                    row.push(
                        schedule[dayIndex]?.[person]
                        || ""
                    );
                }
            }


            csv +=
                row.join(",") +
                "\n";
        });



        /* ---------------------------------------------
           LIVE STATISTICS IN EXPORT
           --------------------------------------------- */

        csv +=
            "\nStatistik\n";


        csv +=
            "Person,Hisingen,Frölunda,Hemma,Totalt kontor\n";


        people.forEach(person => {


            const h =
                countLocation(
                    person,
                    "H"
                );


            const f =
                countLocation(
                    person,
                    "F"
                );


            const home =
                countLocation(
                    person,
                    "HOME"
                );


            csv +=
                `${person},${h},${f},${home},${h + f}\n`;
        });



        const blob =
            new Blob(
                [csv],
                {
                    type:
                        "text/csv;charset=utf-8;"
                }
            );


        const link =
            document.createElement("a");


        const url =
            URL.createObjectURL(
                blob
            );


        link.href = url;

        link.download =
            "manadsschema.csv";


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );


        URL.revokeObjectURL(
            url
        );
    };



    /* =====================================================
       INTERFACE
       ===================================================== */

    return (

        <div
            className="
                min-h-screen
                bg-gradient-to-br
                from-blue-50
                to-indigo-100
                p-8
            "
        >

            <div
                className="
                    max-w-[95%]
                    mx-auto
                "
            >

                <div
                    className="
                        bg-white
                        rounded-xl
                        shadow-2xl
                        p-8
                    "
                >


                    {/* =====================================
                        HEADER
                        ===================================== */}

                    <div
                        className="
                            flex
                            items-center
                            justify-between
                            mb-8
                        "
                    >

                        <div
                            className="
                                flex
                                items-center
                                gap-3
                            "
                        >

                            <CalendarIcon
                                className="
                                    w-8
                                    h-8
                                    text-indigo-600
                                "
                            />


                            <h1
                                className="
                                    text-3xl
                                    font-bold
                                    text-gray-800
                                "
                            >
                                Månatligt Kontorsschema
                                {" "}
                                (4 veckor)
                            </h1>

                        </div>



                        <div
                            className="
                                text-sm
                                text-gray-500
                            "
                        >

                            <label
                                className="
                                    block
                                    text-xs
                                    font-medium
                                    mb-1
                                "
                            >
                                Startdatum
                                (måndagen första veckan):
                            </label>


                            <input
                                type="date"

                                value={
                                    startDate
                                }

                                onChange={
                                    event =>
                                        setStartDate(
                                            event.target.value
                                        )
                                }

                                className="
                                    px-3
                                    py-2
                                    border
                                    rounded
                                "
                            />

                        </div>

                    </div>



                    {/* =====================================
                        BUTTONS
                        ===================================== */}

                    <div
                        className="
                            flex
                            gap-4
                            mb-6
                        "
                    >


                        <button

                            onClick={
                                generateSchedule
                            }

                            className="
                                flex-1
                                bg-indigo-600
                                hover:bg-indigo-700
                                text-white
                                font-semibold
                                py-3
                                px-6
                                rounded-lg
                                transition-colors
                                flex
                                items-center
                                justify-center
                                gap-2
                            "
                        >

                            <RotateIcon
                                className="
                                    w-5
                                    h-5
                                "
                            />

                            Generera 4-veckorsschema

                        </button>



                        <button

                            onClick={
                                resetSchedule
                            }

                            className="
                                bg-gray-500
                                hover:bg-gray-600
                                text-white
                                font-semibold
                                py-3
                                px-6
                                rounded-lg
                            "
                        >
                            Nollställ
                        </button>



                        {
                            Object.keys(
                                schedule
                            ).length > 0 && (

                                <button

                                    onClick={
                                        exportToExcel
                                    }

                                    className="
                                        bg-green-600
                                        hover:bg-green-700
                                        text-white
                                        font-semibold
                                        py-3
                                        px-6
                                        rounded-lg
                                        flex
                                        items-center
                                        gap-2
                                    "
                                >

                                    <DownloadIcon
                                        className="
                                            w-5
                                            h-5
                                        "
                                    />

                                    Exportera

                                </button>
                            )
                        }

                    </div>



                    {/* =====================================
                        RULES
                        ===================================== */}

                    <div
                        className="
                            mb-6
                            p-4
                            bg-blue-50
                            rounded-lg
                        "
                    >

                        <h3
                            className="
                                font-semibold
                                text-gray-700
                                mb-2
                            "
                        >
                            Regler:
                        </h3>


                        <ul
                            className="
                                text-sm
                                text-gray-600
                                space-y-1
                            "
                        >

                            <li>
                                • <strong>
                                    Måndag-Torsdag:
                                </strong>
                                {" "}
                                1 på Hisingen +
                                2 i Frölunda +
                                1 hemma
                            </li>


                            <li>
                                • <strong>
                                    Fredagar:
                                </strong>
                                {" "}
                                0 på Hisingen +
                                2 i Frölunda +
                                2 hemma
                            </li>


                            <li>
                                • Ändra H/F/Hemma manuellt
                                i dropdown-menyn
                            </li>


                            <li>
                                • Statistiken räknas om
                                automatiskt
                            </li>


                            <li>
                                • Lås en placering för att
                                behålla den vid nästa
                                generering
                            </li>

                        </ul>

                    </div>



                    {/* =====================================
                        SCHEDULE
                        ===================================== */}

                    {
                        Object.keys(
                            schedule
                        ).length > 0 && (

                        <>

                            <div
                                className="
                                    overflow-x-auto
                                "
                            >

                                <table
                                    className="
                                        w-full
                                        border-collapse
                                        text-sm
                                    "
                                >

                                    <thead>

                                        <tr
                                            className="
                                                bg-gray-100
                                            "
                                        >

                                            <th
                                                className="
                                                    border
                                                    border-gray-300
                                                    p-2
                                                    text-left
                                                    font-semibold
                                                    sticky
                                                    left-0
                                                    bg-gray-100
                                                    z-10
                                                "
                                            >
                                                Person
                                            </th>



                                            {
                                                Array.from({
                                                    length: 20
                                                }).map(
                                                    (
                                                        _,
                                                        dayIndex
                                                    ) => {


                                                        const firstDay =
                                                            dayIndex % 5 === 0;


                                                        return (

                                                            <th

                                                                key={
                                                                    dayIndex
                                                                }

                                                                className={
                                                                    `
                                                                    border
                                                                    border-gray-300
                                                                    p-2
                                                                    text-center
                                                                    font-semibold
                                                                    ${
                                                                        firstDay
                                                                            ? "week-separator"
                                                                            : ""
                                                                    }
                                                                    `
                                                                }
                                                            >

                                                                <div
                                                                    className="
                                                                        text-xs
                                                                        text-gray-500
                                                                    "
                                                                >
                                                                    V{
                                                                        getWeekNumber(
                                                                            dayIndex
                                                                        )
                                                                    }
                                                                </div>


                                                                <div>

                                                                    {
                                                                        getDayName(
                                                                            dayIndex
                                                                        ).substring(
                                                                            0,
                                                                            3
                                                                        )
                                                                    }

                                                                </div>


                                                                {
                                                                    monthDates[
                                                                        dayIndex
                                                                    ] && (

                                                                        <div
                                                                            className="
                                                                                text-xs
                                                                                text-gray-600
                                                                            "
                                                                        >

                                                                            {
                                                                                formatDate(
                                                                                    monthDates[
                                                                                        dayIndex
                                                                                    ]
                                                                                )
                                                                            }

                                                                        </div>
                                                                    )
                                                                }

                                                            </th>
                                                        );
                                                    }
                                                )
                                            }

                                        </tr>

                                    </thead>



                                    <tbody>

                                        {
                                            people.map(
                                                person => (

                                                <tr
                                                    key={
                                                        person
                                                    }

                                                    className="
                                                        hover:bg-gray-50
                                                    "
                                                >


                                                    <td
                                                        className="
                                                            border
                                                            border-gray-300
                                                            p-2
                                                            font-medium
                                                            sticky
                                                            left-0
                                                            bg-white
                                                            z-10
                                                        "
                                                    >
                                                        {person}
                                                    </td>



                                                    {
                                                        Array.from({
                                                            length: 20
                                                        }).map(
                                                            (
                                                                _,
                                                                dayIndex
                                                            ) => {


                                                                const key =
                                                                    `${person}-${dayIndex}`;


                                                                const location =
                                                                    schedule[
                                                                        dayIndex
                                                                    ]?.[
                                                                        person
                                                                    ];


                                                                const isAway =
                                                                    locked[
                                                                        key
                                                                    ] ===
                                                                    "AWAY";


                                                                const isLocked =
                                                                    Boolean(
                                                                        locked[
                                                                            key
                                                                        ] &&
                                                                        locked[
                                                                            key
                                                                        ] !==
                                                                        "AWAY"
                                                                    );


                                                                const friday =
                                                                    isFriday(
                                                                        dayIndex
                                                                    );


                                                                const firstDay =
                                                                    dayIndex %
                                                                    5 === 0;



                                                                return (

                                                                    <td

                                                                        key={
                                                                            dayIndex
                                                                        }

                                                                        className={
                                                                            `
                                                                            border
                                                                            border-gray-300
                                                                            p-1

                                                                            ${
                                                                                firstDay
                                                                                    ? "week-separator"
                                                                                    : ""
                                                                            }

                                                                            ${
                                                                                friday
                                                                                    ? "bg-yellow-50"
                                                                                    : ""
                                                                            }
                                                                            `
                                                                        }
                                                                    >


                                                                        <div
                                                                            className="
                                                                                flex
                                                                                flex-col
                                                                                items-center
                                                                                gap-1
                                                                            "
                                                                        >


                                                                            <select

                                                                                value={
                                                                                    isAway
                                                                                        ? "AWAY"
                                                                                        : (
                                                                                            location ||
                                                                                            ""
                                                                                        )
                                                                                }


                                                                                onChange={
                                                                                    event => {


                                                                                        const value =
                                                                                            event.target.value;



                                                                                        if (
                                                                                            value ===
                                                                                            "AWAY"
                                                                                        ) {

                                                                                            setAway(
                                                                                                person,
                                                                                                dayIndex
                                                                                            );

                                                                                            return;
                                                                                        }



                                                                                        if (
                                                                                            isAway
                                                                                        ) {

                                                                                            removeAway(
                                                                                                person,
                                                                                                dayIndex
                                                                                            );
                                                                                        }



                                                                                        changeLocation(
                                                                                            person,
                                                                                            dayIndex,
                                                                                            value
                                                                                        );
                                                                                    }
                                                                                }


                                                                                className={
                                                                                    `
                                                                                    w-full
                                                                                    py-1
                                                                                    px-1
                                                                                    rounded
                                                                                    text-xs
                                                                                    font-medium
                                                                                    text-center
                                                                                    cursor-pointer
                                                                                    border-0

                                                                                    ${
                                                                                        isAway
                                                                                            ? "bg-gray-200 text-gray-600"
                                                                                            : getLocationColor(
                                                                                                location
                                                                                            )
                                                                                    }
                                                                                    `
                                                                                }
                                                                            >


                                                                                <option
                                                                                    value=""
                                                                                >
                                                                                    -
                                                                                </option>


                                                                                {
                                                                                    !friday && (

                                                                                        <option
                                                                                            value="H"
                                                                                        >
                                                                                            H
                                                                                        </option>
                                                                                    )
                                                                                }


                                                                                <option
                                                                                    value="F"
                                                                                >
                                                                                    F
                                                                                </option>


                                                                                <option
                                                                                    value="HOME"
                                                                                >
                                                                                    🏠
                                                                                </option>


                                                                                <option
                                                                                    value="AWAY"
                                                                                >
                                                                                    ✖
                                                                                </option>


                                                                            </select>



                                                                            <button

                                                                                onClick={
                                                                                    () =>
                                                                                        toggleLock(
                                                                                            person,
                                                                                            dayIndex
                                                                                        )
                                                                                }

                                                                                disabled={
                                                                                    isAway
                                                                                }

                                                                                className={
                                                                                    `
                                                                                    p-1
                                                                                    rounded

                                                                                    ${
                                                                                        isLocked
                                                                                            ? "text-yellow-600"
                                                                                            : "text-gray-400"
                                                                                    }

                                                                                    ${
                                                                                        isAway
                                                                                            ? "opacity-30 cursor-not-allowed"
                                                                                            : ""
                                                                                    }
                                                                                    `
                                                                                }

                                                                                title={
                                                                                    isLocked
                                                                                        ? "Låst"
                                                                                        : "Lås"
                                                                                }
                                                                            >

                                                                                {
                                                                                    isLocked
                                                                                        ? (
                                                                                            <LockIcon
                                                                                                className="
                                                                                                    w-3
                                                                                                    h-3
                                                                                                "
                                                                                            />
                                                                                        )
                                                                                        : (
                                                                                            <UnlockIcon
                                                                                                className="
                                                                                                    w-3
                                                                                                    h-3
                                                                                                "
                                                                                            />
                                                                                        )
                                                                                }

                                                                            </button>

                                                                        </div>

                                                                    </td>
                                                                );
                                                            }
                                                        )
                                                    }

                                                </tr>
                                            ))
                                        }

                                    </tbody>

                                </table>

                            </div>



                            {/* =================================
                                LIVE STATISTICS
                                ================================= */}

                            <div
                                className="
                                    mt-8
                                    grid
                                    grid-cols-1
                                    md:grid-cols-2
                                    gap-6
                                "
                            >


                                <div
                                    className="
                                        bg-gray-50
                                        p-6
                                        rounded-lg
                                    "
                                >

                                    <h3
                                        className="
                                            font-bold
                                            text-lg
                                            mb-4
                                            text-gray-800
                                        "
                                    >
                                        Statistik
                                        (Hela månaden)
                                    </h3>



                                    <table
                                        className="
                                            w-full
                                            text-sm
                                        "
                                    >

                                        <thead>

                                            <tr
                                                className="
                                                    border-b
                                                    border-gray-300
                                                "
                                            >

                                                <th
                                                    className="
                                                        text-left
                                                        py-2
                                                    "
                                                >
                                                    Person
                                                </th>


                                                <th
                                                    className="
                                                        text-center
                                                        py-2
                                                    "
                                                >
                                                    Hisingen
                                                </th>


                                                <th
                                                    className="
                                                        text-center
                                                        py-2
                                                    "
                                                >
                                                    Frölunda
                                                </th>


                                                <th
                                                    className="
                                                        text-center
                                                        py-2
                                                    "
                                                >
                                                    Hemma
                                                </th>


                                                <th
                                                    className="
                                                        text-center
                                                        py-2
                                                    "
                                                >
                                                    Totalt kontor
                                                </th>

                                            </tr>

                                        </thead>



                                        <tbody>

                                            {
                                                people.map(
                                                    person => {


                                                        /*
                                                         * THESE VALUES ARE
                                                         * CALCULATED DIRECTLY
                                                         * FROM schedule.
                                                         */

                                                        const hCount =
                                                            countLocation(
                                                                person,
                                                                "H"
                                                            );


                                                        const fCount =
                                                            countLocation(
                                                                person,
                                                                "F"
                                                            );


                                                        const homeCount =
                                                            countLocation(
                                                                person,
                                                                "HOME"
                                                            );



                                                        return (

                                                            <tr

                                                                key={
                                                                    person
                                                                }

                                                                className="
                                                                    border-b
                                                                    border-gray-200
                                                                "
                                                            >


                                                                <td
                                                                    className="
                                                                        py-2
                                                                        font-medium
                                                                    "
                                                                >
                                                                    {person}
                                                                </td>


                                                                <td
                                                                    className="
                                                                        text-center
                                                                        py-2
                                                                    "
                                                                >
                                                                    {hCount}
                                                                </td>


                                                                <td
                                                                    className="
                                                                        text-center
                                                                        py-2
                                                                    "
                                                                >
                                                                    {fCount}
                                                                </td>


                                                                <td
                                                                    className="
                                                                        text-center
                                                                        py-2
                                                                    "
                                                                >
                                                                    {homeCount}
                                                                </td>


                                                                <td
                                                                    className="
                                                                        text-center
                                                                        py-2
                                                                        font-semibold
                                                                    "
                                                                >
                                                                    {
                                                                        hCount +
                                                                        fCount
                                                                    }
                                                                </td>

                                                            </tr>
                                                        );
                                                    }
                                                )
                                            }

                                        </tbody>

                                    </table>

                                </div>



                                {/* =================================
                                    SUMMARY
                                    ================================= */}

                                <div
                                    className="
                                        bg-gray-50
                                        p-6
                                        rounded-lg
                                    "
                                >

                                    <h3
                                        className="
                                            font-bold
                                            text-lg
                                            mb-4
                                            text-gray-800
                                        "
                                    >
                                        Sammanfattning
                                    </h3>


                                    <div
                                        className="
                                            space-y-3
                                            text-sm
                                        "
                                    >


                                        <div
                                            className="
                                                flex
                                                justify-between
                                                items-center
                                                pb-2
                                                border-b
                                            "
                                        >

                                            <span
                                                className="
                                                    text-gray-600
                                                "
                                            >
                                                Total arbetsplatsdagar:
                                            </span>


                                            <span
                                                className="
                                                    font-semibold
                                                "
                                            >
                                                20 dagar
                                                (4 veckor)
                                            </span>

                                        </div>



                                        <div
                                            className="
                                                flex
                                                justify-between
                                                items-center
                                                pb-2
                                                border-b
                                            "
                                        >

                                            <span
                                                className="
                                                    text-gray-600
                                                "
                                            >
                                                Planerade
                                                Hisingen-pass:
                                            </span>


                                            <span
                                                className="
                                                    font-semibold
                                                "
                                            >
                                                16
                                            </span>

                                        </div>



                                        <div
                                            className="
                                                flex
                                                justify-between
                                                items-center
                                                pb-2
                                                border-b
                                            "
                                        >

                                            <span
                                                className="
                                                    text-gray-600
                                                "
                                            >
                                                Planerade
                                                Frölunda-pass:
                                            </span>


                                            <span
                                                className="
                                                    font-semibold
                                                "
                                            >
                                                40
                                            </span>

                                        </div>



                                        <div
                                            className="
                                                flex
                                                justify-between
                                                items-center
                                            "
                                        >

                                            <span
                                                className="
                                                    text-gray-600
                                                "
                                            >
                                                Fredagar hemma:
                                            </span>


                                            <span
                                                className="
                                                    font-semibold
                                                "
                                            >
                                                8
                                            </span>

                                        </div>

                                    </div>

                                </div>

                            </div>

                        </>
                    )}

                </div>

            </div>

        </div>
    );
};



/* =========================================================
   START APPLICATION
   ========================================================= */

ReactDOM.render(
    <MonthlyScheduler />,
    document.getElementById("root")
);

</script>

</body>
</html>
