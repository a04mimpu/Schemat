<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Månatligt Kontorsschema</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans',
                'Droid Sans', 'Helvetica Neue', sans-serif;
        }

        .week-separator {
            border-left: 3px solid #4f46e5;
        }
    </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const { useState, useEffect } = React;


/* ---------------- ICONS ---------------- */

const LockIcon = ({ className }) => (
    <svg className={className}
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         strokeWidth="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
);

const UnlockIcon = ({ className }) => (
    <svg className={className}
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         strokeWidth="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
    </svg>
);

const CalendarIcon = ({ className }) => (
    <svg className={className}
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         strokeWidth="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
    </svg>
);

const RotateIcon = ({ className }) => (
    <svg className={className}
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         strokeWidth="2">
        <polyline points="1 4 1 10 7 10"></polyline>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
    </svg>
);

const DownloadIcon = ({ className }) => (
    <svg className={className}
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         strokeWidth="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
    </svg>
);


/* ---------------- APPLICATION ---------------- */

const MonthlyScheduler = () => {

    const people = [
        'Gunilla',
        'Minetthe',
        'Lennart',
        'Carl'
    ];

    const weekdays = [
        'Måndag',
        'Tisdag',
        'Onsdag',
        'Torsdag',
        'Fredag'
    ];

    const [schedule, setSchedule] = useState({});
    const [locked, setLocked] = useState({});
    const [startDate, setStartDate] = useState('');
    const [monthDates, setMonthDates] = useState([]);


    /* ---------------- DATES ---------------- */

    useEffect(() => {

        if (startDate) {
            calculateMonthDates(startDate);
        }

    }, [startDate]);


    const calculateMonthDates = (dateString) => {

        const start = new Date(dateString);

        const dates = [];

        let currentDate = new Date(start);

        for (let i = 0; i < 20; i++) {

            while (
                currentDate.getDay() === 0 ||
                currentDate.getDay() === 6
            ) {
                currentDate.setDate(
                    currentDate.getDate() + 1
                );
            }

            dates.push(new Date(currentDate));

            currentDate.setDate(
                currentDate.getDate() + 1
            );
        }

        setMonthDates(dates);
    };


    const formatDate = (date) => {

        const day =
            String(date.getDate())
                .padStart(2, '0');

        const month =
            String(date.getMonth() + 1)
                .padStart(2, '0');

        return `${day}/${month}`;
    };


    const getWeekNumber = (index) =>
        Math.floor(index / 5) + 1;


    const getDayName = (index) =>
        weekdays[index % 5];


    const isFriday = (index) =>
        index % 5 === 4;


    /* ============================================================
       STATISTICS
       IMPORTANT:
       Statistics are ALWAYS calculated from the current schedule.
       ============================================================ */

    const calculateStats = () => {

        const result = {};

        people.forEach(person => {

            result[person] = {
                H: 0,
                F: 0,
                HOME: 0
            };

        });


        Object.values(schedule).forEach(day => {

            people.forEach(person => {

                const location = day?.[person];

                if (
                    location === 'H' ||
                    location === 'F' ||
                    location === 'HOME'
                ) {
                    result[person][location]++;
                }

            });

        });

        return result;
    };


    /*
       stats is therefore NOT a separate state anymore.
       It is derived directly from the schedule.
    */

    const stats = calculateStats();


    /* ---------------- GENERATE SCHEDULE ---------------- */

    const generateSchedule = () => {

        const newSchedule = {};

        /*
           Temporary statistics used only while generating
           a balanced schedule.
        */

        const workingStats = {};

        people.forEach(person => {

            workingStats[person] = {
                H: 0,
                F: 0,
                HOME: 0
            };

        });


        for (
            let dayIndex = 0;
            dayIndex < 20;
            dayIndex++
        ) {

            const dailyAssignments = {};

            const friday = isFriday(dayIndex);


            /*
             * AWAY means unavailable.
             */

            const availablePeople =
                people.filter(person => {

                    const key =
                        `${person}-${dayIndex}`;

                    return locked[key] !== 'AWAY';

                });


            /*
             * FIRST:
             * preserve locked assignments.
             */

            people.forEach(person => {

                const key =
                    `${person}-${dayIndex}`;

                const lockedLocation =
                    locked[key];

                if (
                    lockedLocation &&
                    lockedLocation !== 'AWAY'
                ) {

                    dailyAssignments[person] =
                        lockedLocation;

                    workingStats[person][lockedLocation]++;

                    const index =
                        availablePeople.indexOf(person);

                    if (index > -1) {
                        availablePeople.splice(index, 1);
                    }
                }

            });


            const assigned =
                Object.values(dailyAssignments);

            const hCount =
                assigned.filter(
                    location => location === 'H'
                ).length;

            const fCount =
                assigned.filter(
                    location => location === 'F'
                ).length;

            const homeCount =
                assigned.filter(
                    location => location === 'HOME'
                ).length;


            let needH;
            let needF;
            let needHome;


            if (friday) {

                /*
                 Friday:
                 0 Hisingen
                 2 Frölunda
                 2 Home
                */

                needH = 0;

                needF =
                    Math.max(
                        0,
                        2 - fCount
                    );

                needHome =
                    Math.max(
                        0,
                        2 - homeCount
                    );

            } else {

                /*
                 Monday-Thursday:
                 1 Hisingen
                 2 Frölunda
                 1 Home
                */

                needH =
                    Math.max(
                        0,
                        1 - hCount
                    );

                needF =
                    Math.max(
                        0,
                        2 - fCount
                    );

                needHome =
                    Math.max(
                        0,
                        1 - homeCount
                    );
            }


            /*
             * Choose the person who currently has
             * the fewest assignments at that location.
             */

            const choosePerson = (location) => {

                if (availablePeople.length === 0) {
                    return null;
                }

                const candidates =
                    [...availablePeople]
                        .sort((a, b) => {

                            return (
                                workingStats[a][location] -
                                workingStats[b][location]
                            );

                        });

                /*
                 * If several people have the same amount,
                 * randomly choose between them.
                 */

                const lowest =
                    workingStats[
                        candidates[0]
                    ][location];

                const equalCandidates =
                    candidates.filter(person =>
                        workingStats[person][location] === lowest
                    );

                return equalCandidates[
                    Math.floor(
                        Math.random() *
                        equalCandidates.length
                    )
                ];
            };


            const assignLocation =
                (location, amount) => {

                    for (
                        let i = 0;
                        i < amount;
                        i++
                    ) {

                        const person =
                            choosePerson(location);

                        if (!person) {
                            return;
                        }

                        dailyAssignments[person] =
                            location;

                        workingStats[person][location]++;

                        const index =
                            availablePeople.indexOf(person);

                        if (index > -1) {
                            availablePeople.splice(index, 1);
                        }
                    }
                };


            if (!friday) {
                assignLocation('H', needH);
            }

            assignLocation('F', needF);

            assignLocation(
                'HOME',
                needHome
            );


            newSchedule[dayIndex] =
                dailyAssignments;
        }


        setSchedule(newSchedule);
    };


    /* ---------------- MANUAL CHANGE ---------------- */

    const changeLocation =
        (person, dayIndex, newLocation) => {

            setSchedule(prev => {

                /*
                 IMPORTANT:
                 copy both the schedule AND the individual day.
                 This avoids mutating React state.
                */

                const newSchedule = {
                    ...prev,
                    [dayIndex]: {
                        ...(prev[dayIndex] || {})
                    }
                };


                if (newLocation === '') {

                    delete newSchedule[dayIndex][person];

                } else {

                    newSchedule[dayIndex][person] =
                        newLocation;
                }


                return newSchedule;
            });
        };


    /* ---------------- LOCK ---------------- */

    const toggleLock =
        (person, dayIndex) => {

            const key =
                `${person}-${dayIndex}`;


            setLocked(prev => {

                const newLocked = {
                    ...prev
                };


                if (newLocked[key]) {

                    delete newLocked[key];

                } else {

                    const currentLocation =
                        schedule[dayIndex]?.[person];

                    if (currentLocation) {

                        newLocked[key] =
                            currentLocation;
                    }
                }


                return newLocked;
            });
        };


    /* ---------------- RESET ---------------- */

    const resetSchedule = () => {

        setSchedule({});
        setLocked({});

    };


    /* ---------------- COLORS ---------------- */

    const getLocationColor =
        (location) => {

            switch (location) {

                case 'H':
                    return 'bg-pink-100 text-pink-800';

                case 'F':
                    return 'bg-green-100 text-green-800';

                case 'HOME':
                    return 'bg-blue-100 text-blue-800';

                case 'AWAY':
                    return 'bg-gray-200 text-gray-600';

                default:
                    return 'bg-white';
            }
        };


    /* ---------------- EXPORT ---------------- */

    const exportToExcel = () => {

        let csv =
            'Månatligt Schema\n';

        csv +=
            'Startdatum:,' +
            (startDate || 'Ej angivet') +
            '\n\n';


        csv += 'Person,';


        for (
            let i = 0;
            i < 20;
            i++
        ) {

            const dayName =
                getDayName(i);

            const date =
                monthDates[i]
                    ? formatDate(monthDates[i])
                    : '';

            csv +=
                `${dayName} ${date},`;
        }


        csv += '\n';


        people.forEach(person => {

            const row = [person];


            for (
                let i = 0;
                i < 20;
                i++
            ) {

                const key =
                    `${person}-${i}`;

                const location =
                    locked[key] === 'AWAY'
                        ? 'AWAY'
                        : schedule[i]?.[person];

                row.push(
                    location || ''
                );
            }


            csv +=
                row.join(',') +
                '\n';
        });


        csv +=
            '\nStatistik\n';

        csv +=
            'Person,Hisingen,Frölunda,Hemma,Totalt kontor\n';


        people.forEach(person => {

            const totalOffice =
                stats[person].H +
                stats[person].F;

            csv +=
                `${person},` +
                `${stats[person].H},` +
                `${stats[person].F},` +
                `${stats[person].HOME},` +
                `${totalOffice}\n`;
        });


        const blob =
            new Blob(
                [csv],
                {
                    type:
                        'text/csv;charset=utf-8;'
                }
            );


        const link =
            document.createElement('a');

        link.href =
            URL.createObjectURL(blob);

        link.download =
            'manadsschema.csv';

        link.click();

        URL.revokeObjectURL(link.href);
    };


    /* ============================================================
       USER INTERFACE
       ============================================================ */

    return (

        <div className=
            "min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8"
        >

            <div className=
                "max-w-[95%] mx-auto"
            >

                <div className=
                    "bg-white rounded-xl shadow-2xl p-8"
                >


                    {/* HEADER */}

                    <div className=
                        "flex items-center justify-between mb-8"
                    >

                        <div className=
                            "flex items-center gap-3"
                        >

                            <CalendarIcon
                                className=
                                    "w-8 h-8 text-indigo-600"
                            />

                            <h1 className=
                                "text-3xl font-bold text-gray-800"
                            >
                                Månatligt Kontorsschema
                                (4 veckor)
                            </h1>

                        </div>


                        <div className=
                            "text-sm text-gray-500"
                        >

                            <label className=
                                "block text-xs font-medium mb-1"
                            >
                                Startdatum
                                (måndagen första veckan):
                            </label>

                            <input
                                type="date"
                                value={startDate}
                                onChange={
                                    e =>
                                        setStartDate(
                                            e.target.value
                                        )
                                }
                                className=
                                    "px-3 py-2 border rounded"
                            />

                        </div>

                    </div>


                    {/* BUTTONS */}

                    <div className=
                        "flex gap-4 mb-6"
                    >

                        <button
                            onClick={
                                generateSchedule
                            }
                            className=
                                "flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors flex items-center justify-center gap-2"
                        >

                            <RotateIcon
                                className=
                                    "w-5 h-5"
                            />

                            Generera 4-veckorsschema

                        </button>


                        <button
                            onClick={
                                resetSchedule
                            }
                            className=
                                "bg-gray-500 hover:bg-gray-600 text-white font-semibold py-3 px-6 rounded-lg"
                        >
                            Nollställ
                        </button>


                        {
                            Object.keys(schedule)
                                .length > 0 && (

                            <button
                                onClick={
                                    exportToExcel
                                }
                                className=
                                    "bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg flex items-center gap-2"
                            >

                                <DownloadIcon
                                    className=
                                        "w-5 h-5"
                                />

                                Exportera

                            </button>
                        )}

                    </div>


                    {/* RULES */}

                    <div className=
                        "mb-6 p-4 bg-blue-50 rounded-lg"
                    >

                        <h3 className=
                            "font-semibold text-gray-700 mb-2"
                        >
                            Regler:
                        </h3>

                        <ul className=
                            "text-sm text-gray-600 space-y-1"
                        >

                            <li>
                                • <strong>Måndag-Torsdag:</strong>
                                {' '}1 på Hisingen + 2 i Frölunda + 1 hemma
                            </li>

                            <li>
                                • <strong>Fredagar:</strong>
                                {' '}0 på Hisingen + 2 i Frölunda + 2 hemma
                            </li>

                            <li>
                                • Ändra plats manuellt med dropdown-menyn
                            </li>

                            <li>
                                • Statistiken uppdateras automatiskt
                            </li>

                            <li>
                                • Lås en placering för att behålla den
                                vid nästa generering
                            </li>

                        </ul>

                    </div>


                    {
                        Object.keys(schedule)
                            .length > 0 && (

                        <>

                            {/* SCHEDULE TABLE */}

                            <div className=
                                "overflow-x-auto"
                            >

                                <table className=
                                    "w-full border-collapse text-sm"
                                >

                                    <thead>

                                        <tr className=
                                            "bg-gray-100"
                                        >

                                            <th className=
                                                "border border-gray-300 p-2 text-left font-semibold sticky left-0 bg-gray-100 z-10"
                                            >
                                                Person
                                            </th>


                                            {
                                                Array.from({
                                                    length: 20
                                                }).map(
                                                    (_, dayIndex) => {

                                                        const first =
                                                            dayIndex % 5 === 0;

                                                        return (

                                                            <th
                                                                key={dayIndex}
                                                                className={
                                                                    `border border-gray-300 p-2 text-center font-semibold ${
                                                                        first
                                                                            ? 'week-separator'
                                                                            : ''
                                                                    }`
                                                                }
                                                            >

                                                                <div className=
                                                                    "text-xs text-gray-500"
                                                                >
                                                                    V{getWeekNumber(dayIndex)}
                                                                </div>

                                                                <div>
                                                                    {
                                                                        getDayName(dayIndex)
                                                                            .substring(0,3)
                                                                    }
                                                                </div>

                                                                {
                                                                    monthDates[dayIndex] && (

                                                                    <div className=
                                                                        "text-xs text-gray-600"
                                                                    >
                                                                        {
                                                                            formatDate(
                                                                                monthDates[dayIndex]
                                                                            )
                                                                        }
                                                                    </div>
                                                                )}

                                                            </th>
                                                        );
                                                    }
                                                )
                                            }

                                        </tr>

                                    </thead>


                                    <tbody>

                                    {
                                        people.map(person => (

                                            <tr
                                                key={person}
                                                className=
                                                    "hover:bg-gray-50"
                                            >

                                                <td className=
                                                    "border border-gray-300 p-2 font-medium sticky left-0 bg-white z-10"
                                                >
                                                    {person}
                                                </td>


                                                {
                                                    Array.from({
                                                        length: 20
                                                    }).map(
                                                        (_, dayIndex) => {

                                                            const location =
                                                                schedule[dayIndex]?.[person];

                                                            const key =
                                                                `${person}-${dayIndex}`;

                                                            const isLocked =
                                                                locked[key] &&
                                                                locked[key] !== 'AWAY';

                                                            const isAway =
                                                                locked[key] === 'AWAY';

                                                            const first =
                                                                dayIndex % 5 === 0;

                                                            const friday =
                                                                isFriday(dayIndex);


                                                            return (

                                                                <td
                                                                    key={dayIndex}
                                                                    className={
                                                                        `border border-gray-300 p-1 ${
                                                                            first
                                                                                ? 'week-separator'
                                                                                : ''
                                                                        } ${
                                                                            friday
                                                                                ? 'bg-yellow-50'
                                                                                : ''
                                                                        }`
                                                                    }
                                                                >

                                                                    <div className=
                                                                        "flex flex-col items-center gap-1"
                                                                    >

                                                                        <select

                                                                            value={
                                                                                isAway
                                                                                    ? 'AWAY'
                                                                                    : (location || '')
                                                                            }

                                                                            onChange={
                                                                                e => {

                                                                                    const value =
                                                                                        e.target.value;


                                                                                    if (
                                                                                        value === 'AWAY'
                                                                                    ) {

                                                                                        setLocked(prev => ({
                                                                                            ...prev,
                                                                                            [key]: 'AWAY'
                                                                                        }));

                                                                                        changeLocation(
                                                                                            person,
                                                                                            dayIndex,
                                                                                            ''
                                                                                        );

                                                                                    } else {

                                                                                        /*
                                                                                         Remove AWAY if the
                                                                                         person becomes available.
                                                                                        */

                                                                                        if (
                                                                                            locked[key] === 'AWAY'
                                                                                        ) {

                                                                                            setLocked(prev => {

                                                                                                const next = {
                                                                                                    ...prev
                                                                                                };

                                                                                                delete next[key];

                                                                                                return next;
                                                                                            });
                                                                                        }


                                                                                        changeLocation(
                                                                                            person,
                                                                                            dayIndex,
                                                                                            value
                                                                                        );
                                                                                    }
                                                                                }
                                                                            }

                                                                            className={
                                                                                `w-full py-1 px-1 rounded text-xs font-medium text-center cursor-pointer border-0 ${
                                                                                    isAway
                                                                                        ? 'bg-gray-200 text-gray-600'
                                                                                        : getLocationColor(location)
                                                                                }`
                                                                            }
                                                                        >

                                                                            <option value="">
                                                                                -
                                                                            </option>

                                                                            {
                                                                                !friday && (
                                                                                    <option value="H">
                                                                                        H
                                                                                    </option>
                                                                                )
                                                                            }

                                                                            <option value="F">
                                                                                F
                                                                            </option>

                                                                            <option value="HOME">
                                                                                🏠
                                                                            </option>

                                                                            <option value="AWAY">
                                                                                ✖
                                                                            </option>

                                                                        </select>


                                                                        <button

                                                                            onClick={
                                                                                () =>
                                                                                    toggleLock(
                                                                                        person,
                                                                                        dayIndex
                                                                                    )
                                                                            }

                                                                            className={
                                                                                `p-1 rounded ${
                                                                                    isLocked
                                                                                        ? 'text-yellow-600'
                                                                                        : 'text-gray-400'
                                                                                }`
                                                                            }

                                                                            title={
                                                                                isLocked
                                                                                    ? 'Låst'
                                                                                    : 'Lås'
                                                                            }
                                                                        >

                                                                            {
                                                                                isLocked
                                                                                    ? (
                                                                                        <LockIcon
                                                                                            className="w-3 h-3"
                                                                                        />
                                                                                    )
                                                                                    : (
                                                                                        <UnlockIcon
                                                                                            className="w-3 h-3"
                                                                                        />
                                                                                    )
                                                                            }

                                                                        </button>

                                                                    </div>

                                                                </td>
                                                            );
                                                        }
                                                    )
                                                }

                                            </tr>

                                        ))
                                    }

                                    </tbody>

                                </table>

                            </div>


                            {/* STATISTICS */}

                            <div className=
                                "mt-8 grid grid-cols-1 md:grid-cols-2 gap-6"
                            >

                                <div className=
                                    "bg-gray-50 p-6 rounded-lg"
                                >

                                    <h3 className=
                                        "font-bold text-lg mb-4 text-gray-800"
                                    >
                                        Statistik
                                        (Hela månaden)
                                    </h3>


                                    <table className=
                                        "w-full text-sm"
                                    >

                                        <thead>

                                            <tr className=
                                                "border-b border-gray-300"
                                            >

                                                <th className=
                                                    "text-left py-2"
                                                >
                                                    Person
                                                </th>

                                                <th className=
                                                    "text-center py-2"
                                                >
                                                    Hisingen
                                                </th>

                                                <th className=
                                                    "text-center py-2"
                                                >
                                                    Frölunda
                                                </th>

                                                <th className=
                                                    "text-center py-2"
                                                >
                                                    Hemma
                                                </th>

                                                <th className=
                                                    "text-center py-2"
                                                >
                                                    Totalt kontor
                                                </th>

                                            </tr>

                                        </thead>


                                        <tbody>

                                        {
                                            people.map(person => (

                                                <tr
                                                    key={person}
                                                    className=
                                                        "border-b border-gray-200"
                                                >

                                                    <td className=
                                                        "py-2 font-medium"
                                                    >
                                                        {person}
                                                    </td>

                                                    <td className=
                                                        "text-center py-2"
                                                    >
                                                        {stats[person].H}
                                                    </td>

                                                    <td className=
                                                        "text-center py-2"
                                                    >
                                                        {stats[person].F}
                                                    </td>

                                                    <td className=
                                                        "text-center py-2"
                                                    >
                                                        {stats[person].HOME}
                                                    </td>

                                                    <td className=
                                                        "text-center py-2 font-semibold"
                                                    >
                                                        {
                                                            stats[person].H +
                                                            stats[person].F
                                                        }
                                                    </td>

                                                </tr>

                                            ))
                                        }

                                        </tbody>

                                    </table>

                                </div>


                                {/* SUMMARY */}

                                <div className=
                                    "bg-gray-50 p-6 rounded-lg"
                                >

                                    <h3 className=
                                        "font-bold text-lg mb-4 text-gray-800"
                                    >
                                        Sammanfattning
                                    </h3>


                                    <div className=
                                        "space-y-3 text-sm"
                                    >

                                        <div className=
                                            "flex justify-between items-center pb-2 border-b"
                                        >

                                            <span className=
                                                "text-gray-600"
                                            >
                                                Total arbetsplatsdagar:
                                            </span>

                                            <span className=
                                                "font-semibold"
                                            >
                                                20 dagar
                                                (4 veckor)
                                            </span>

                                        </div>


                                        <div className=
                                            "flex justify-between items-center pb-2 border-b"
                                        >

                                            <span className=
                                                "text-gray-600"
                                            >
                                                Totalt Hisingen-pass:
                                            </span>

                                            <span className=
                                                "font-semibold"
                                            >
                                                16 pass
                                                (mån-tors)
                                            </span>

                                        </div>


                                        <div className=
                                            "flex justify-between items-center pb-2 border-b"
                                        >

                                            <span className=
                                                "text-gray-600"
                                            >
                                                Totalt Frölunda-pass:
                                            </span>

                                            <span className=
                                                "font-semibold"
                                            >
                                                40 pass
                                                (2 per dag)
                                            </span>

                                        </div>


                                        <div className=
                                            "flex justify-between items-center"
                                        >

                                            <span className=
                                                "text-gray-600"
                                            >
                                                Fredagar hemma:
                                            </span>

                                            <span className=
                                                "font-semibold"
                                            >
                                                8 pass
                                                (2 per fredag)
                                            </span>

                                        </div>

                                    </div>

                                </div>

                            </div>

                        </>
                    )}

                </div>

            </div>

        </div>
    );
};


/* ---------------- START REACT ---------------- */

ReactDOM.render(
    <MonthlyScheduler />,
